# Configuration for SyntheticAugmentationConfig.
# Hyperparameters for the synthetic-image augmentation pipeline.

_target_: deepfont.data.config.SyntheticAugmentationConfig

image_size: 105
squeeze_ratio: 0.4  # 1 / 2.5
scale_limit: 0.4
rotate_bounds: [-3, 3]
shear_bounds: [-3, 3]
blur_limit: [0.5, 1.0]
noise_mean_range: [0.0, 0.0]
noise_std_range: [0.008, 0.016]
rot_flip_prob: 0.0
invert_prob: 0.0
affine_prob: 1.0
blur_prob: 1.0
brightness_contrast_prob: 0.0
noise_prob: 1.0
gradient_prob: 1.0
gradient_fg_range: [140, 220]
gradient_bg_range: [20, 100]
gradient_a_range: [0.4, 0.6]
